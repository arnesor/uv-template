[project]
name = "{{cookiecutter.project_name}}"
version = "{{cookiecutter.version}}"
description = "{{cookiecutter.friendly_name}}"
authors = [{ name = "{{cookiecutter.author}}", email = "{{cookiecutter.email}}" }]
license = "{{cookiecutter.license}}"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0.1",
]

[project.urls]
homepage = "https://github.com/{{cookiecutter.github_organization}}/{{cookiecutter.project_name}}"
repository = "https://github.com/{{cookiecutter.github_organization}}/{{cookiecutter.project_name}}"
Changelog = "https://github.com/{{cookiecutter.github_organization}}/{{cookiecutter.project_name}}/releases"

[project.scripts]
{{cookiecutter.project_name}} = "{{cookiecutter.package_name}}.__main__:main"

[dependency-groups]
lint = [
    "pre-commit>=4.4.0",
    "pre-commit-hooks>=6.0.0",
    "ruff>=0.14.5",
    "rumdl>=0.2.73",
]

# Type hint stubs should be placed in the dev dependency group
dev = [
    {include-group = "lint"},
    "coverage>=7.11.3",
    "deptry>=0.24.0",
    "mypy>=1.18.2",
    "pytest>=9.0.0",
    "xdoctest[colors]>=1.3.0",
]

[tool.coverage.run]
branch = true
source = ["{{cookiecutter.package_name}}"]
relative_files = true

[tool.coverage.report]
show_missing = true
{% if cookiecutter.code_quality_level == "High" %}
fail_under = 80
{% elif cookiecutter.code_quality_level == "Medium" %}
fail_under = 50
{% else %}
fail_under = 20
{% endif %}

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_context = true

[tool.rumdl]
flavor = "gfm"
line-length = 100

[tool.rumdl.MD013]
code-blocks = false
line-length = 100
reflow = true
reflow-length-exemptions = true
reflow-mode = "semantic-line-breaks"
tables = false

[tool.ruff]
force-exclude = true  # Apply excludes to pre-commit
show-fixes = true
src = ["src", "tests"]
target-version = "py312"  # Minimum Python version supported
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]
extend-exclude = [
    "__pycache__",
    "old",
    ".ipynb_checkpoints",
]

# Ruff rules may be customized as desired: https://docs.astral.sh/ruff/rules/
[tool.ruff.lint]
{% if cookiecutter.code_quality_level == "High" %}
select = ["ALL"]
{% elif cookiecutter.code_quality_level == "Medium" %}
select = [
    "A",    # prevent using keywords that clobber python builtins
    "ANN",  # check type annotations
    "B",    # bugbear: catch likely bugs and design problems
    "D",    # documentation
    "E",    # pycodestyle
    "F",    # pyflakes
    "ISC",  # implicit string concatenation
    "I",    # sort imports
    "UP",   # alert you when better syntax is available in your python version
    "RUF",  # the ruff developer's own rules
    "S",    # security checks from flake8-bandit
]
{% else %}
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
]
{% endif %}
ignore = [
    "ANN202", # Don't require return type annotation for private functions.
    "ANN401", # Allow type annotation with type Any.
    "CPY001", # Don't require copyright notices in every Python file.
    "D100",   # Supress undocumented-public-module. Only doc of public api required.
    "FBT001", # Allow boolean positional arguments in a function.
    "FBT002", # Allow boolean default positional arguments in a function.
    "E402",   # Supress module-import-not-at-top-of-file, needed in jupyter notebooks.
    "E501",   # Supress line-too-long warnings: trust ruff's judgement on this one.
    "PLR2004", # Allow to compare with unnamed numerical constants.

    # Disable rules conflicting with ruff as a formatter,
    # see https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
]
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"  # You can also use "numpy".

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "validator", "root_validator", "pydantic.validator"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"**/tests/*" = [
    "ANN001",  # type annotations don't add value for test functions
    "ANN002",  # type annotations don't add value for test functions
    "ANN003",  # type annotations don't add value for test functions
    "ANN201",  # type annotations don't add value for test functions
    "ANN204",  # type annotations don't add value for test functions
    "ANN205",  # type annotations don't add value for test functions
    "ANN206",  # type annotations don't add value for test functions
    "D100",    # docstrings are overkill for test functions
    "D101",
    "D102",
    "D103",
    "S101",    # asserts are encouraged in pytest
]

[tool.uv]
exclude-newer = "7 days"
{% if cookiecutter.package_name != cookiecutter.project_name.replace('-', '_') %}

[tool.uv.build-backend]
module-name = "{{cookiecutter.package_name}}"
{% endif %}

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
