name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PRE_COMMIT_COLOR: "always"

jobs:
  quality:
    name: Quality / Python 3.13
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Get uv version from constraints
        id: uv-version
        shell: pwsh
        run: |
          $UV_VERSION = (Get-Content .github/workflows/constraints.txt | Where-Object { $_ -match '^uv==' } | ForEach-Object { ($_ -split '==')[1] })
          echo "version=$UV_VERSION" >> $env:GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          version: {{ "${{ steps.uv-version.outputs.version }}" }}
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --hook-stage=manual --show-diff-on-failure

      - name: Run mypy
        run: uv run mypy src tests

      - name: Run deptry
        run: uv run deptry .

      - name: Run documentation examples
        run: uv run python -m xdoctest --modname={{cookiecutter.package_name}} --command=all --colored=1

  tests:
    name: Tests / Python ${{"{{"}} matrix.python {{"}}"}} / ${{"{{"}} matrix.os {{"}}"}}
    runs-on: ${{"{{"}} matrix.os {{"}}"}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", os: "ubuntu-latest" }
          - { python: "3.14", os: "ubuntu-latest" }
          - { python: "3.13", os: "windows-latest" }
          - { python: "3.13", os: "macos-latest" }

    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Get uv version from constraints
        id: uv-version
        shell: pwsh
        run: |
          $UV_VERSION = (Get-Content .github/workflows/constraints.txt | Where-Object { $_ -match '^uv==' } | ForEach-Object { ($_ -split '==')[1] })
          echo "version=$UV_VERSION" >> $env:GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          version: {{ "${{ steps.uv-version.outputs.version }}" }}
          python-version: ${{"{{"}} matrix.python {{"}}"}}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  coverage:
    name: Coverage / Python 3.13 / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: {{ "${{ secrets.SONAR_TOKEN }}" }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get uv version from constraints
        id: uv-version
        shell: pwsh
        run: |
          $UV_VERSION = (Get-Content .github/workflows/constraints.txt | Where-Object { $_ -match '^uv==' } | ForEach-Object { ($_ -split '==')[1] })
          echo "version=$UV_VERSION" >> $env:GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          version: {{ "${{ steps.uv-version.outputs.version }}" }}
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: uv run coverage run -m pytest

      - name: Display coverage report
        run: uv run coverage report --skip-empty

      - name: Create coverage report
        run: uv run coverage xml

      - name: SonarQube Cloud Scan
        if: {{ "${{ env.SONAR_TOKEN != '' && github.actor != 'dependabot[bot]' }}" }}
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432  # v8.0.0

  release:
    name: Release
    if: {{ "${{ github.event_name == 'push' }}" }}
    needs:
      - quality
      - tests
      - coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect version change
        id: version
        shell: python
        run: |
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          current = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          identifier = r"(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
          version_pattern = (
              rf"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)"
              rf"(?:-{identifier}(?:\.{identifier})*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
          )
          if not isinstance(current, str) or re.fullmatch(version_pattern, current) is None:
              raise SystemExit("project.version must use semantic versioning")

          tag = f"v{current}"
          repository_tags = subprocess.run(
              ["git", "tag", "--merged", "HEAD", "--sort=-version:refname", "--list", "v*"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          tags = [candidate for candidate in repository_tags if re.fullmatch(f"v{version_pattern}", candidate)]

          if tags:
              if tag in tags and tag != tags[0]:
                  raise SystemExit(f"release tag {tag} already exists and is not the latest release")
              changed = tag != tags[0]
          else:
              root = subprocess.run(
                  ["git", "rev-list", "--max-parents=0", "HEAD"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()[0]
              initial_file = subprocess.run(
                  ["git", "show", f"{root}:pyproject.toml"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              initial = current
              if initial_file.returncode == 0:
                  initial = tomllib.loads(initial_file.stdout)["project"]["version"]
              changed = initial != current

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"changed={str(changed).lower()}\n")
              output.write(f"version={current}\n")

      - name: Publish GitHub release
        if: steps.version.outputs.changed == 'true'
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9  # v7
        with:
          commitish: {{ "${{ github.sha }}" }}
          name: v{{ "${{ steps.version.outputs.version }}" }}
          publish: true
          tag: v{{ "${{ steps.version.outputs.version }}" }}
          version: {{ "${{ steps.version.outputs.version }}" }}
